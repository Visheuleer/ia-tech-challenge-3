model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  max_length: 1024

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05

training:
  epochs: 1
  learning_rate: 0.0002

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1

  gradient_accumulation_steps: 8

  warmup_ratio: 0.1
  weight_decay: 0.01

  logging_steps: 5

  seed: 42

output:
  directory: "artifacts/models/hypertension-assistant"