[project]
name = "ia-tech-challenge-3"
version = "0.1.0"
description = "Assistente clínico baseado em LLM para apoio ao acompanhamento de pacientes com hipertensão."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "langchain>=0.3.0",
    "langgraph>=0.6.0",
    "faiss-cpu>=1.11.0",
    "python-dotenv>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=6.0.1",
]


[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "httpx>=0.28.0",
    "ruff>=0.12.0",
]

training = [
    "torch>=2.7.0",
    "transformers>=4.53.0",
    "datasets>=4.0.0",
    "peft>=0.16.0",
    "trl>=0.20.0",
    "accelerate>=1.9.0",
    "sentencepiece>=0.2.0",
    "bitsandbytes>=0.46.0",
    "pyyaml>=6.0.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["backend/medical_assistant"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v"


[tool.ruff]
target-version = "py312"
line-length = 100

exclude = [
    ".venv",
    "frontend",
    "data",
    "artifacts",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
